body{font-family:system-ui,Arial;background:#0b1020;color:#fff;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}
.card{background:#151d35;border:1px solid #2d3a60;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 30px #0004}

<div id="app" class="hidden">

rmati pendapat"]], ["Berbagi alat belajar", 5, ["berbagi"]], ["Mengajak kelas tertib", 5, ["menjaga ketertiban"]]]}, {"q": "Sebutkan contoh kebaikan kepada guru!", "a": [["Menghormati guru", 25, ["sopan kepada guru"]], ["Mendengarkan penjelasan", 20, ["memperhatikan guru"]], ["Mengerjakan tugas", 15, ["mengumpulkan tugas"]], ["Berbicara dengan sopan", 12, ["santun kepada guru"]], ["Meminta izin dengan baik", 10, ["izin"]], ["Membantu guru", 8, ["menolong guru"]], ["Menjaga nama baik sekolah", 5, ["menjaga nama baik"]], ["Mendoakan guru", 5, ["doa untuk guru"]]]}, {"q": "Sebutkan contoh kebaikan saat bekerja dalam kelompok!", "a": [["Membagi tugas dengan adil", 25, ["pembagian tugas"]], ["Mau membantu anggota", 20, ["membantu anggota"]], ["Mendengarkan pendapat", 15, ["mendengar pendapat"]], ["Bertanggung jawab", 12, ["tanggung jawab"]], ["Tidak mendominasi", 10, ["tidak egois"]], ["Menghargai perbedaan", 8, ["menghormati perbedaan"]], ["Menyelesaikan tugas tepat waktu", 5, ["tepat waktu"]], ["Memberi semangat", 5, ["menyemangati"]]]}, {"q": "Sebutkan contoh kebaikan ketika melihat sampah berserakan!", "a": [["Memungut dan membuang ke tempatnya", 25, ["memungut sampah"]], ["Mengajak teman membersihkan", 20, ["mengajak bersih-bersih"]], ["Memilah sampah", 15, ["memisahkan sampah"]], ["Tidak menambah sampah", 12, ["tidak membuang sampah"]], ["Membersihkan lingkungan", 10, ["membersihkan"]], ["Mengingatkan dengan sopan", 8, ["menegur dengan sopan"]], ["Mendaur ulang", 5, ["daur ulang"]], ["Menjaga tempat tetap bersih", 5, ["menjaga kebersihan"]]]}, {"q": "Sebutkan contoh kebaikan kepada teman yang berbeda pendapat!", "a": [["Menghargai pendapatnya", 25, ["menghormati pendapat"]], ["Mendengarkan dengan baik", 20, ["mendengarkan"]], ["Tidak memaksakan kehendak", 15, ["tidak memaksa"]], ["Bermusyawarah", 12, ["musyawarah"]], ["Berbicara sopan", 10, ["santun"]], ["Mencari solusi bersama", 8, ["solusi bersama"]], ["Tidak mengejek", 5, ["tidak menghina"]], ["Tetap berteman", let db, roomRef, state, mode, myTeam, myName, roomCode, localTimer, myTeamId;
const HOST_PIN='7392';
function toggleHostPin(){document.getElementById('pinBox').classList.toggle('hidden',document.getElementById('mode').value!=='host');}

let audioCtx=null, musicTimer=null, musicStep=0, musicWasPlaying=false;
function initAudio(){try{if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume();}catch(e){}}
function startMusic(){
  try{
    initAudio();
    stopMusic();
    musicStep=0;
    const notes=[110,110,146.83,110,164.81,146.83,110,130.81];
    musicTimer=setInterval(()=>{
      if(!audioCtx || state?.status!=='playing') return;
      const t=audioCtx.currentTime;
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type='square'; o.frequency.value=notes[musicStep%notes.length];
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.045,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.14);
      if(musicStep%2===0){
        const b=audioCtx.createOscillator(), bg=audioCtx.createGain(); b.type='sine'; b.frequency.value=70;
        bg.gain.setValueAtTime(0.0001,t); bg.gain.exponentialRampToValueAtTime(0.08,t+0.01); bg.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
        b.connect(bg); bg.connect(audioCtx.destination); b.start(t); b.stop(t+0.1);
      }
      musicStep++;
    },180);
  }catch(e){}
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\\s+/g,' ').trim()}
function teamKey(name){return 'team_'+Array.from(norm(name)).map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join('')}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function join(){
 mode=document.getElementById('mode').value; roomCode=norm(document.getElementById('room').value).replace(/ /g,'').toUpperCase();
 myName=document.getElementById('name').value.trim(); myTeam=document.getElementById('team').value.trim();
 if(!roomCode||!myName){document.getElementById('loginMsg').textContent='Lengkapi kode room dan nama.';return}
 if(mode==='host' && document.getElementById('hostPin').value!==HOST_PIN){document.getElementById('loginMsg').textContent='PIN Guru salah. Akses Guru/Host ditolak.';return}
 if(window.FIREBASE_CONFIG.apiKey==='GANTI_API_KEY'){document.getElementById('loginMsg').textContent='Firebase belum dikonfigurasi. Isi config.js terlebih dahulu.';return}
 firebase.initializeApp(window.FIREBASE_CONFIG); db=firebase.database(); roomRef=db.ref('rooms/'+roomCode); initAudio();
 if(mode==='host') hostInit(); else studentInit();
}
function hostInit(){
 document.getElementById('classBox').classList.add('hidden');
 roomRef.set({status:'waiting',qIndex:0,startedAt:0,remaining:600,teams:{},found:{},revealed:{},lastMessage:'Menunggu kelompok masuk...'});
 enterApp(); renderHost();
}
function studentInit(){
 if(!myTeam){document.getElementById('loginMsg').textContent='Isi nama kelompok.';return}
 const id=teamKey(myTeam);
 myTeamId=id;
 const teamRef=roomRef.child('teams/'+id);
 teamRef.transaction(v=>v||{name:myTeam,player:myName,score:0,lives:4,joinedAt:firebase.database.ServerValue.TIMESTAMP});
 enterApp(); roomRef.on('value',s=>{state=s.val()||{};renderStudent()});
}
function enterApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}
function renderHost(){
 roomRef.on('value',s=>{state=s.val()||{}; renderHostUI()});
}
function currentQ(){return QUESTIONS[state?.qIndex||0]}
function answers(){return currentQ()?.a||[]}
function renderHostUI(){
 let teams=Object.values(state.teams||{}); let q=currentQ();
 document.getElementById('top').innerHTML=`<div class="big">ROOM: ${roomCode}</div><div>Status: <b>${state.status}</b> • Soal ${((state.qIndex||0)+1)}/25 • Waktu <b id="timer">${fmt(state.remaining??600)}</b></div>`;
 let controls='';
 if(state.status==='waiting') controls=`<button onclick="startGame()">▶️ Mulai Game</button>`;
 else if(state.status==='playing') controls=`<button class="warn" onclick="finishRound()">🛑 Selesaikan Babak</button> <button onclick="pauseGame()">⏸️ Jeda</button> <button class="danger" onclick="endGameNow()">🏁 Akhiri Permainan</button>`;
 else if(state.status==='paused') controls=`<button onclick="resumeGame()">▶️ Lanjutkan</button> <button class="warn" onclick="finishRound()">🛑 Selesaikan Babak</button> <button class="danger" onclick="endGameNow()">🏁 Akhiri Permainan</button>`;
 else if(state.status==='revealing') controls=`<button onclick="nextQ()">➡️ Lanjut Soal ${((state.roundPos||0)+2)<=25?((state.roundPos||0)+2):'Berikutnya'}</button> <button class="danger" onclick="endGameNow()">🏁 Akhiri Permainan</button>`;
 else if(state.status==='finished') controls=`<b>🏁 Permainan selesai</b> <button onclick="printScores()">🖨️ Cetak Rekap Nilai</button>`;
 document.getElementById('game').innerHTML=`<h2>${esc(q.q)}</h2>${controls}<hr><div class="answers">${answers().map((x,i)=>{let found=(state.found||{})[i], rev=(state.revealed||{})[i];return `<div class="answer ${found?'found':''}"><b>${(found||rev)?'✓ '+esc(x[0]):'🔒 Jawaban '+(i+1)}</b><small>${found?(x[1]+' poin • '+esc(found.teamName)):rev?(x[1]+' poin • Jawaban dibuka'):'Belum dibuka'}</small><br>${!found&&!rev&&state.status==='revealing'?`<button onclick="reveal(${i})">Buka</button>`:''}</div>`}).join('')}</div><hr><h3>Jawaban Masuk</h3><div id="subs">${Object.values(state.submissions||{}).slice(-12).reverse().map(s=>`<div class="team"><span><b>${esc(s.teamName)}</b>: ${esc(s.text)}</span><span><button class="ok" onclick="manual('${s.id}',${s.match??-1})">✓</button> <button class="danger" onclick="reject('${s.id}')">✕</button></span></div>`).join('')||'<span class="muted">Belum ada jawaban.</span>'}</div>`;
 document.getElementById('teams').innerHTML='<h2>🏆 Klasemen</h2>'+teams.sort((a,b)=>b.score-a.score).map((t,i)=>`<div class="team"><span>${i+1}. ${esc(t.name)}</span><span><b>${t.score||0}</b> • ❤️ ${Number(t.lives??4)}</span></div>`).join('');
}
function fmt(n){n=Math.max(0,Number(n)||0);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function resetLives(){
 let ups={}; Object.keys(state.teams||{}).forEach(id=>ups['teams/'+id+'/lives']=4); return roomRef.update(ups);
}
function startGame(){
 musicWasPlaying=true; let order=shuffle([...Array(25).keys()]);
 roomRef.update({status:'playing',qIndex:order[0],order,roundPos:0,remaining:600,startedAt:Date.now(),found:{},revealed:{},submissions:{},lastMessage:'Soal 1 dimulai!'}).then(()=>{resetLives();startTick();startMusic()});
}
function pauseGame(){musicWasPlaying=false;stopMusic();roomRef.update({status:'paused',lastMessage:'Game dijeda.'})}
function resumeGame(){roomRef.update({status:'playing',startedAt:Date.now()-(600-(state.remaining??600))*1000,lastMessage:'Game dilanjutkan.'});startTick();startMusic()}
function finishRound(){musicWasPlaying=false;stopMusic();clearInterval(localTimer);roomRef.update({status:'revealing',remaining:0,lastMessage:'Babak selesai. Guru membuka jawaban satu per satu.'})}
function nextQ(){
 let o=state.order||[...Array(25).keys()], pos=Number(state.roundPos||0), next=o[pos+1];
 if(next===undefined){finishGame();return}
 roomRef.update({status:'playing',qIndex:next,roundPos:pos+1,remaining:600,found:{},revealed:{},submissions:{},lastMessage:'Soal '+(pos+2)+' dimulai!',startedAt:Date.now()}).then(()=>{resetLives();startTick();startMusic()});
}
function finishGame(){musicWasPlaying=false;stopMusic();clearInterval(localTimer);roomRef.update({status:'finished',remaining:0,lastMessage:'Semua 25 soal selesai.'})}
function endGameNow(){
  if(!confirm('Yakin ingin mengakhiri seluruh permainan? Semua kelompok akan berhenti menjawab dan skor terakhir akan disimpan.')) return;
  musicWasPlaying=false; stopMusic(); clearInterval(localTimer);
  roomRef.update({status:'finished',remaining:0,lastMessage:'Permainan diakhiri oleh Guru. Skor terakhir disimpan.'});
}
function printScores(){
  const teams=Object.values(state.teams||{}).sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0));
  const now=new Date().toLocaleString('id-ID');
  const rows=teams.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name||'')}</td><td>${Number(t.score)||0}</td></tr>`).join('');
  const w=window.open('','_blank');
  if(!w){alert('Popup diblokir browser. Izinkan pop-up lalu tekan Cetak Rekap Nilai lagi.');return}
  w.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Rekap Nilai Family 100</title><style>body{font-family:Arial,sans-serif;padding:30px;color:#111}h1,h2{text-align:center;margin:4px 0}p{text-align:center}.meta{margin:20px 0}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{border:1px solid #333;padding:9px;text-align:left}th{text-align:center}td:first-child,td:last-child{text-align:center} .sign{margin-top:50px;text-align:right}@media print{button{display:none}}</style></head><body><h1>REKAP NILAI</h1><h2>Family 100 — Berlomba dalam Kebaikan</h2><p>SMK Ma'arif Kota Mungkid</p><div class="meta">Kode Room: <b>${esc(roomCode)}</b><br>Tanggal/Jam: ${esc(now)}</div><table><thead><tr><th>Peringkat</th><th>Kelompok</th><th>Nilai</th></tr></thead><tbody>${rows||'<tr><td colspan="3">Belum ada kelompok</td></tr>'}</tbody></table><div class="sign">Guru/Host<br><br><br>________________________</div></body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),500);
}
function startTick(){clearInterval(localTimer);localTimer=setInterval(()=>{if(state.status==='playing'){let rem=Math.max(0,Math.floor((state.startedAt+600000-Date.now())/1000));if(rem!==Number(state.remaining))roomRef.child('remaining').set(rem);if(rem<=0)finishRound()}},1000)}
function reveal(i){if(state.status==='revealing') roomRef.child('revealed/'+i).set(true)}
function submit(text){
 if(!text.trim()||state.status!=='playing')return;
 let teamId=myTeamId||teamKey(myTeam);
 let teamRef=roomRef.child('teams/'+teamId);
 let q=answers(), n=norm(text), match=-1;
 q.forEach((x,i)=>{let words=[x[0],...(x[2]||[])].map(norm); if(words.some(w=>w===n || (w.length>=5&&n.includes(w)) || (n.length>=5&&w.includes(n)))) match=i});
 let found=state.found||{};
 let id=roomRef.child('submissions').push().key;
 roomRef.child('submissions/'+id).set({id,teamId,teamName:myTeam,text,match,at:firebase.database.ServerValue.TIMESTAMP});
 if(match<0){
   // NYAWA BENAR-BENAR TERPISAH: hanya data kelompok pengirim yang diubah.
   teamRef.child('lives').transaction(v=>Math.max(0,(v==null?4:Number(v))-1)).then(res=>{
     const lives=Number(res.snapshot.val()??0);
     if(lives<=0) roomRef.child('lastMessage').set(myTeam+' — nyawa habis.');
     else roomRef.child('lastMessage').set(myTeam+' — jawaban salah. Nyawa tersisa '+lives+'.');
   });
   document.getElementById('answer').value=''; return;
 }
 if(found[match]){roomRef.child('lastMessage').set(myTeam+' — Jawaban sudah ditemukan!');document.getElementById('answer').value='';return;}
 // Klaim jawaban secara atomik: hanya kelompok pertama yang berhasil mendapat poin.
 roomRef.child('found/'+match).transaction(v=>v||{teamId,teamName:myTeam,text,at:firebase.database.ServerValue.TIMESTAMP}).then(res=>{
   if(res.committed && res.snapshot.val() && res.snapshot.val().teamId===teamId){
     teamRef.child('score').transaction(v=>(Number(v)||0)+q[match][1]);
     roomRef.child('lastMessage').set('Jawaban ditemukan: '+q[match][0]+' — '+myTeam+' mendapat '+q[match][1]+' poin.');
   } else roomRef.child('lastMessage').set(myTeam+' — Jawaban sudah ditemukan!');
 });
 document.getElementById('answer').value='';
}
function renderStudent(){
 let q=currentQ();
 if(state.status==='playing' && !musicWasPlaying){ musicWasPlaying=true; startMusic(); }
 if(state.status!=='playing' && musicWasPlaying){ musicWasPlaying=false; stopMusic(); }
 let teams=Object.values(state.teams||{}); let me=(state.teams||{})[myTeamId]||{score:0,lives:4};
 // Jangan mengganti DOM soal/input setiap update Firebase (mis. timer tiap detik), agar keyboard HP tidak menutup saat mengetik.
 if(state.status==='playing' && document.getElementById('answer')){
   const top=document.getElementById('top');
   top.innerHTML=`<div class="big">${esc(myTeam)}</div><div>Room: ${roomCode} • Nilai: <b>${me.score||0}</b> • ❤️ ${me.lives??4}</div>`;
   const t=document.querySelector('#game .muted'); if(t) t.textContent='Waktu '+fmt(state.remaining??600);
   const msg=document.querySelector('#game p b'); if(msg) msg.textContent=state.lastMessage||'';
   const inp=document.getElementById('answer'); if(inp && document.activeElement===inp) return;
   return;
 }
 document.getElementById('top').innerHTML=`<div class="big">${esc(myTeam)}</div><div>Room: ${roomCode} • Nilai: <b>${me.score||0}</b> • ❤️ ${me.lives??4}</div>`;
 if(state.status==='waiting'){document.getElementById('game').innerHTML='<h2>⏳ Menunggu Guru Memulai...</h2><p>Anda sudah masuk. Tunggu semua kelompok siap.</p>';return}
 if(state.status==='finished'){document.getElementById('game').innerHTML='<h2>🏁 Permainan Selesai</h2><p>Permainan telah diakhiri. Nilai terakhir: <b>'+me.score+'</b></p><p class="muted">Tunggu arahan Guru untuk sesi berikutnya.</p>';return}
 if(state.status==='revealing'){document.getElementById('game').innerHTML=`<h2>🔔 Babak Selesai</h2><p>Guru sedang membuka jawaban.</p><div class="answers">${answers().map((x,i)=>{let f=(state.found||{})[i],r=(state.revealed||{})[i];return `<div class="answer ${f?'found':''}"><b>${(f||r)?'✓ '+esc(x[0]):'🔒 Tertutup'}</b><small>${(f||r)?x[1]+' poin':'Belum dibuka'}</small></div>`}).join('')}</div>`;return}
 document.getElementById('game').innerHTML=`<h2>${esc(q.q)}</h2><div class="muted">${state.status==='paused'?'⏸️ Game dijeda':'Waktu '+fmt(state.remaining??600)}</div><p>Nyawa: ${'❤️'.repeat(me.lives??4)}${(me.lives??4)===0?' — <b>Nyawa habis</b>':''}</p><br><input id="answer" placeholder="Ketik jawaban..." onkeydown="if(event.key==='Enter')submit(this.value)" ${state.status!=='playing'||(me.lives??0)<=0?'disabled':''}><button onclick="submit(document.getElementById('answer').value)" ${state.status!=='playing'||(me.lives??0)<=0?'disabled':''}>Kirim</button><p><b>${esc(state.lastMessage||'')}</b></p><div class="answers">${answers().map((x,i)=>{let f=(state.found||{})[i];return `<div class="answer ${f?'found':''}"><b>${f?'✓ '+esc(x[0]):'🔒 Tertutup'}</b>${f?'<small>'+x[1]+' poin</small>':''}</div>`}).join('')}</div>`;
 document.getElementById('teams').innerHTML='<h2>🏆 Klasemen</h2>'+teams.sort((a,b)=>b.score-a.score).map((t,i)=>`<div class="team"><span>${i+1}. ${esc(t.name)}</span><span>${t.score||0}</span></div>`).join('');
}
function manual(id,match){if(match>=0 && !(state.found||{})[match]){let s=(state.submissions||{})[id];roomRef.child('found/'+match).set({teamId:'manual',teamName:s.teamName,text:s.text,at:firebase.database.ServerValue.TIMESTAMP});roomRef.child('teams').once('value').then(sn=>sn.forEach(ch=>{if(ch.val().name===s.teamName)ch.ref.child('score').transaction(v=>(v||0)+answers()[match][1])}))}}
function reject(id){roomRef.child('submissions/'+id).remove()}
</script></body></html>
